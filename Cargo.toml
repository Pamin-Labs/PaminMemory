[workspace]
resolver = "3"
members = [
    "crates/pamin-core",
    "crates/pamin-store",
    "crates/pamin-index",
    "crates/pamin-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/Pamin-Labs/PaminMemory"

[workspace.dependencies]
pamin-core = { path = "crates/pamin-core" }
pamin-index = { path = "crates/pamin-index" }
pamin-store = { path = "crates/pamin-store" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
refinery = { version = "0.8", features = ["tokio-postgres"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Release profile aims at the binary-size budget gate in CI.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
