name: Sync InternalDocs submodule

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: InternalDocs branch, tag, or commit to sync
        required: true
        default: main
      target_branch:
        description: PaminMemory branch to target with the sync PR
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-internal-docs-${{ github.event.inputs.target_branch }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync internal-docs pointer
    runs-on: ubuntu-latest

    env:
      INTERNAL_DOCS_REPO: Pamin-Labs/InternalDocs
      SUBMODULE_PATH: internal-docs
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check trigger actor permission
        run: |
          set -euo pipefail

          permission_payload="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission"
          )"
          role_name="$(jq -r '.role_name // .permission // "none"' <<< "${permission_payload}")"
          can_maintain="$(jq -r '.user.permissions.maintain // false' <<< "${permission_payload}")"

          case "${role_name}:${can_maintain}" in
            admin:*|maintain:*|*:true)
              echo "Actor ${GITHUB_ACTOR} has ${role_name} permission."
              ;;
            *)
              echo "::error::Only admins and maintainers can run this workflow. ${GITHUB_ACTOR} has ${role_name} permission."
              exit 1
              ;;
          esac

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync submodule pointer
        id: sync
        env:
          INTERNAL_DOCS_READ_TOKEN: ${{ secrets.INTERNAL_DOCS_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${SOURCE_REF}" =~ [[:space:]] ]] || [[ "${SOURCE_REF}" == -* ]]; then
            echo "::error::source_ref must not contain whitespace or start with '-'."
            exit 1
          fi

          if ! git check-ref-format --branch "${TARGET_BRANCH}" >/dev/null; then
            echo "::error::target_branch is not a valid branch name: ${TARGET_BRANCH}"
            exit 1
          fi

          if [ -z "${INTERNAL_DOCS_READ_TOKEN}" ]; then
            echo "::error::Missing INTERNAL_DOCS_READ_TOKEN secret with read access to ${INTERNAL_DOCS_REPO}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          old_sha="$(git ls-tree HEAD "${SUBMODULE_PATH}" | awk '{print $3}')"
          if [ -z "${old_sha}" ]; then
            echo "::error::Could not read existing ${SUBMODULE_PATH} submodule pointer."
            exit 1
          fi

          rm -rf "${SUBMODULE_PATH}"
          git clone \
            --no-checkout \
            "https://x-access-token:${INTERNAL_DOCS_READ_TOKEN}@github.com/${INTERNAL_DOCS_REPO}.git" \
            "${SUBMODULE_PATH}"

          git -C "${SUBMODULE_PATH}" fetch --depth=1 origin "${SOURCE_REF}"
          new_sha="$(git -C "${SUBMODULE_PATH}" rev-parse FETCH_HEAD)"
          git -C "${SUBMODULE_PATH}" checkout --detach "${new_sha}"

          if [ "${old_sha}" = "${new_sha}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "old_sha=${old_sha}" >> "${GITHUB_OUTPUT}"
            echo "new_sha=${new_sha}" >> "${GITHUB_OUTPUT}"
            echo "short_sha=${new_sha:0:12}" >> "${GITHUB_OUTPUT}"
            echo "Submodule ${SUBMODULE_PATH} is already at ${new_sha}."
            exit 0
          fi

          git add "${SUBMODULE_PATH}"

          branch_name="codex/sync-internal-docs-${new_sha:0:12}"
          git commit -m "ci: sync internal docs submodule"

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"
          echo "old_sha=${old_sha}" >> "${GITHUB_OUTPUT}"
          echo "new_sha=${new_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${new_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Push sync branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git fetch \
            origin \
            "refs/heads/${{ steps.sync.outputs.branch_name }}:refs/remotes/origin/${{ steps.sync.outputs.branch_name }}" \
            || true

          git push \
            --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${{ steps.sync.outputs.branch_name }}"

      - name: Create or update pull request
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail

          title="ci: sync internal docs submodule"
          body_file="$(mktemp)"
          cat > "${body_file}" <<EOF
          Sync \`${SUBMODULE_PATH}\` to the latest requested \`${INTERNAL_DOCS_REPO}\` revision.

          - Source ref: \`${SOURCE_REF}\`
          - Old SHA: \`${{ steps.sync.outputs.old_sha }}\`
          - New SHA: \`${{ steps.sync.outputs.new_sha }}\`
          - Triggered by: @${GITHUB_ACTOR}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          existing_pr="$(
            gh pr list \
              --head "${{ steps.sync.outputs.branch_name }}" \
              --base "${TARGET_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --title "${title}" --body-file "${body_file}"
          else
            gh pr create \
              --head "${{ steps.sync.outputs.branch_name }}" \
              --base "${TARGET_BRANCH}" \
              --title "${title}" \
              --body-file "${body_file}"
          fi
